<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Escolha o que compartilhar</title>
<style>
  :root { --fundo:#0f0809; --fundo-2:#1a0e10; --borda:rgba(255,190,180,.09); --texto:#f0e4e1; --texto-2:#b09a97;
          --cor:#c23b45; --cor-2:#e0626a; --ouro:#f2b84b; --raio:22px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 0%, #2a1115, var(--fundo) 70%); color:var(--texto);
              font-family:"Inter", system-ui, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:22px 26px 8px; }
  h1 { margin:0; font-size:22px; font-weight:700; background:linear-gradient(90deg,var(--cor-2),var(--ouro)); -webkit-background-clip:text; color:transparent; }
  .abas { display:flex; gap:8px; padding:12px 26px; }
  .aba { border:1px solid var(--borda); background:rgba(255,220,215,.05); color:var(--texto-2); padding:8px 18px; border-radius:999px; cursor:pointer; font:inherit; }
  .aba.ativa { background:linear-gradient(135deg,var(--cor),#7d1f28); color:#fff; border-color:transparent; }
  main { flex:1; overflow:auto; padding:6px 26px 16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; align-content:start; }
  .fonte { border:2px solid var(--borda); background:var(--fundo-2); border-radius:var(--raio); padding:10px; cursor:pointer; transition:.15s; text-align:left; color:inherit; font:inherit; }
  .fonte:hover { border-color:rgba(242,184,75,.4); transform:translateY(-2px); }
  .fonte.sel { border-color:var(--ouro); box-shadow:0 0 0 4px rgba(242,184,75,.15), 0 0 24px rgba(242,184,75,.2); }
  .fonte img.mini { width:100%; aspect-ratio:16/9; object-fit:contain; background:#000; border-radius:14px; display:block; }
  .nome { display:flex; align-items:center; gap:8px; margin-top:9px; font-size:13px; white-space:nowrap; overflow:hidden; }
  .nome span { overflow:hidden; text-overflow:ellipsis; }
  .nome img { width:16px; height:16px; flex:none; }
  .vazio { color:var(--texto-2); grid-column:1/-1; text-align:center; padding:40px; }
  footer { display:flex; align-items:center; gap:12px; padding:14px 26px 20px; border-top:1px solid var(--borda); }
  label.som { display:flex; align-items:center; gap:8px; color:var(--texto-2); font-size:14px; cursor:pointer; }
  label.som input { accent-color:var(--ouro); width:17px; height:17px; }
  .dica { color:var(--texto-2); font-size:12px; }
  .espaco { flex:1; }
  button.btn { border:0; border-radius:999px; padding:11px 22px; font:inherit; font-weight:600; cursor:pointer; }
  .btn-cancelar { background:rgba(255,220,215,.07); color:var(--texto); }
  .btn-ok { background:linear-gradient(135deg,var(--ouro),#d88a2a); color:#2a1214; }
  .btn-ok:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header><h1>Escolha o que compartilhar</h1></header>
<div class="abas">
  <button class="aba ativa" data-tipo="tela">🖥️ Tela inteira</button>
  <button class="aba" data-tipo="janela">🪟 Janela</button>
</div>
<main id="lista"></main>
<footer>
  <label class="som" id="caixa-som"><input type="checkbox" id="som" checked> Mandar o som do PC</label>
  <span class="dica" id="dica"></span>
  <span class="espaco"></span>
  <button class="btn btn-cancelar" id="cancelar">Cancelar</button>
  <button class="btn btn-ok" id="ok" disabled>Compartilhar</button>
</footer>
<script>
(async () => {
  const { fontes, pedeSom, somDoPC } = await window.seletor.dados();
  const $ = (s) => document.querySelector(s);
  let tipo = "tela", escolhida = null;

  // Som: no Windows vai o som do PC inteiro; no Linux/Mac o sistema não deixa
  if (!pedeSom) $("#caixa-som").style.display = "none";
  else if (!somDoPC) { $("#som").checked = false; $("#som").disabled = true; $("#dica").textContent = "O som do PC só funciona no Windows."; }
  else $("#dica").textContent = "Vai o som de tudo que toca no PC.";

  function desenhar() {
    const lista = fontes.filter((f) => f.tipo === tipo);
    $("#lista").innerHTML = "";
    if (!lista.length) $("#lista").innerHTML = `<div class="vazio">Nenhuma ${tipo === "tela" ? "tela" : "janela"} encontrada.</div>`;
    lista.forEach((f) => {
      const b = document.createElement("button");
      b.className = "fonte" + (escolhida === f.id ? " sel" : "");
      const mini = document.createElement("img"); mini.className = "mini"; mini.src = f.miniatura; b.appendChild(mini);
      const nome = document.createElement("div"); nome.className = "nome";
      if (f.icone) { const i = document.createElement("img"); i.src = f.icone; nome.appendChild(i); }
      const t = document.createElement("span"); t.textContent = f.nome; t.title = f.nome; nome.appendChild(t);
      b.appendChild(nome);
      b.onclick = () => { escolhida = f.id; $("#ok").disabled = false; desenhar(); };
      b.ondblclick = () => { escolhida = f.id; enviar(); };
      $("#lista").appendChild(b);
    });
  }
  // Se só tem uma tela, já deixa ela escolhida
  const telas = fontes.filter((f) => f.tipo === "tela");
  if (telas.length === 1) { escolhida = telas[0].id; $("#ok").disabled = false; }

  document.querySelectorAll(".aba").forEach((a) => a.onclick = () => {
    document.querySelectorAll(".aba").forEach((x) => x.classList.toggle("ativa", x === a));
    tipo = a.dataset.tipo; desenhar();
  });
  const enviar = () => { if (escolhida) window.seletor.escolher(escolhida, $("#som").checked); };
  $("#ok").onclick = enviar;
  $("#cancelar").onclick = () => window.close();
  addEventListener("keydown", (e) => { if (e.key === "Escape") window.close(); if (e.key === "Enter") enviar(); });
  desenhar();
})();
</script>
</body>
</html>
