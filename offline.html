<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cinema</title>
<style>
  html,body{margin:0;height:100%;background:#0e0d0c;color:#f1e9dc;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;display:flex;-webkit-font-smoothing:antialiased}
  .caixa{margin:auto;text-align:center;padding:30px;max-width:420px}
  svg{width:56px;height:56px} h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;margin:18px 0 8px}
  p{color:#a59c8f;margin:0 0 24px;line-height:1.5}
  button{border:0;border-radius:999px;height:42px;padding:0 22px;font:inherit;font-weight:500;cursor:pointer;background:#e8a54b;color:#1a1207}
  button:hover{background:#f0b562}
</style></head>
<body><div class="caixa"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M43.6 20.4 A16.4 16.4 0 1 0 43.6 43.6" fill="none" stroke="#f1e9dc" stroke-width="6.2" stroke-linecap="round" opacity=".5"/><circle cx="46.2" cy="32" r="4.1" fill="#6f675d"/></svg><h1>Sem conexão</h1>
<p>Confira sua internet. Vou tentar de novo sozinho daqui a pouco.</p><button id="tentar">Tentar de novo</button></div>
<script>
  const volta = new URLSearchParams(location.search).get("volta") || "https://cinema-juntos.vercel.app";
  const ir = () => { location.href = volta; };
  document.getElementById("tentar").onclick = ir;
  setTimeout(ir, 15000);
</script></body></html>
